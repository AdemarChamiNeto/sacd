server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Fotos de até 5 MB (o padrão do Nginx é 1 MB e recusaria o upload)
  client_max_body_size 6m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Cabeçalhos de segurança (o HSTS fica no Caddy, que é quem fala HTTPS)
  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fotos enviadas: só imagem, nunca executa nada
  location /uploads/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
    location ~* \.(jpg|png|webp)$ { try_files $uri =404; }
    return 404;
  }

  # Arquivos do build com hash no nome: cache longo
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
